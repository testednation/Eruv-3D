    <script>
      // Suppress Vite HMR WebSocket disconnect messages in cloud proxy/iFrame environments
      (function() {
        const origConsoleError = console.error;
        console.error = function(...args) {
          const msg = args.map(a => (typeof a === 'object' && a !== null ? (a.message || a.stack || String(a)) : String(a))).join(' ');
          if (msg.includes('WebSocket closed without opened') || msg.includes('vite-hmr')) {
            return;
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('error', function(event) {
          const msg = (event && event.message) || '';
          const filename = (event && event.filename) || '';
          if (msg.includes('WebSocket closed without opened') || msg.includes('vite-hmr') || filename.includes('@vite/client')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          const reason = String((event && event.reason) || '');
          if (reason.includes('WebSocket closed without opened') || reason.includes('vite-hmr')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
