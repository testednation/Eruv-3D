<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer boundary halo -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e293b" stroke-width="8" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-dasharray="12 12" stroke-width="4" opacity="0.6" />

  <!-- Ground plane -->
  <line x1="96" y1="384" x2="416" y2="384" stroke="#475569" stroke-width="8" stroke-linecap="round" />

  <!-- Left Post (Lechi) -->
  <rect x="136" y="148" width="28" height="236" rx="6" fill="#38bdf8" />
  <rect x="132" y="140" width="36" height="12" rx="3" fill="#64748b" />

  <!-- Right Post (Lechi) -->
  <rect x="348" y="148" width="28" height="236" rx="6" fill="#38bdf8" />
  <rect x="344" y="140" width="36" height="12" rx="3" fill="#64748b" />

  <!-- Overhead Wire / Lintel (Korah directly overhead - Al Gabav) -->
  <rect x="120" y="128" width="272" height="16" rx="8" fill="url(#emeraldGrad)" />

  <!-- Virtual Halachic Wall (Gud Asek) projection glow -->
  <rect x="164" y="148" width="184" height="236" fill="#10b981" opacity="0.12" />

  <!-- Central Synagogue / Star motif in center -->
  <path d="M 256 190 L 290 250 L 222 250 Z" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />
  <path d="M 256 270 L 290 210 L 222 210 Z" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Sparkle dots -->
  <circle cx="256" cy="100" r="12" fill="#fbbf24" />
  <circle cx="150" cy="120" r="6" fill="#34d399" />
  <circle cx="362" cy="120" r="6" fill="#34d399" />
</svg>
